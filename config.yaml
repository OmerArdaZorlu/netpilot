# Network Traffic Controller - ana yapılandırma
# Bu dosyadaki her alanın koddaki bir varsayılanı var; sadece değiştirmek
# istediklerini burada tut.

mode: simulation          # simulation | live   (live faz 2'de açılacak)

link:
  downlink_mbps: 200      # WAN indirme kapasitesi
  uplink_mbps: 20         # WAN yükleme kapasitesi
  congestion_threshold: 0.80   # bu oranın üstü "tıkanma" sayılır
  critical_threshold: 0.94     # bu oranın üstü "kritik"

collector:
  tick_seconds: 1.0       # simülatörün kaç saniyede bir akış üreteceği
  window_seconds: 60      # metrik penceresi

# Akış optimize edici (ntc/traffic/flowopt.py)
flow:
  enabled: true
  interval_seconds: 15      # LP çözümü; eşik döngüsünden seyrek koşuyor
  min_pullback_mbps: 0.5    # bunun altındaki eksik "geri çek" sayılmıyor

# Topoloji — yazılmazsa `link:` kapasitelerinden tek çıkışlı varsayılan kurulur.
# Birden çok WAN çıkışın varsa buradan tanımla; çözücü trafiği aralarında
# bölebilir, sayaçlı olanı en son kullanır, bozulanından kaçınır.
#
# topology:
#   default_access: sw-access
#   edges:
#     - {src: sw-access, dst: sw-core,  capacity_mbps: 1000, kind: access}
#     - {src: sw-core,   dst: sw-access, capacity_mbps: 1000, kind: access}
#     - {src: sw-core,   dst: nvr,      capacity_mbps: 1000, kind: lan}
#     - {src: nvr,       dst: sw-core,  capacity_mbps: 1000, kind: lan}
#     - {src: sw-core,   dst: fiber,    capacity_mbps: 200, latency_ms: 8,  kind: wan}
#     - {src: fiber,     dst: internet, capacity_mbps: 200, latency_ms: 8,  kind: wan}
#     - {src: sw-core,   dst: lte,      capacity_mbps: 50,  latency_ms: 45, cost_per_gb: 4, kind: wan}
#     - {src: lte,       dst: internet, capacity_mbps: 50,  latency_ms: 45, cost_per_gb: 4, kind: wan}
#     # health: 0.0-1.0 — bozulan hattı silmek yerine daraltmak için

optimizer:
  enabled: true
  interval_seconds: 5
  auto_apply: false       # true ise öneriler otomatik "uygulandı" işaretlenir
  hog_share_threshold: 0.35    # tek cihaz toplam bandın %35'ini aşarsa hog
  min_confidence_to_apply: 0.7

ai:
  provider: auto          # auto | foundry | ollama | mock
  # Takma ad `phi-4-mini` varsayilan olarak OpenVINO varyantina cozuluyor;
  # o Intel iGPU'da kosuyor ve olculen hiz 9.5 tok/sn. Bu makinede RTX 4060
  # var, CUDA varyanti 60 tok/sn veriyor -> varyanti acikca sabitliyoruz.
  # Baska bir makinede: takma ada geri don (phi-4-mini) ya da o makinenin
  # varyantini yaz. `foundry model info phi-4-mini` secenekleri listeler.
  model: Phi-4-mini-instruct-cuda-gpu
  base_url: ""            # boş = Foundry Local ucu otomatik keşfedilir
  temperature: 0.2
  timeout_seconds: 120
  # Ollama geliştirme yedeği (model adlandırması Foundry'den farklı)
  ollama_base_url: http://127.0.0.1:11434
  ollama_model: phi4-mini
  analysis_interval_seconds: 30   # AI analistin çalışma sıklığı
  max_snapshot_flows: 25

api:
  host: 127.0.0.1
  port: 8080

storage:
  path: data/ntc.db
  retain_hours: 24

logging:
  level: INFO
