# Network Traffic Controller - ana yapılandırma
# Bu dosyadaki her alanın koddaki bir varsayılanı var; sadece değiştirmek
# istediklerini burada tut.

# Akış kaynağı. Bu alan artık gerçekten kaynağı seçiyor (`ntc/traffic/source.py`);
# önceden yalnız ekrana basılıyordu ve `live` yazan kurulum sessizce simülasyon
# üretmeye devam ediyordu. Bilinmeyen bir değer yazılırsa sistem açılışta hata
# verir — yazım hatası yüzünden "gerçek ağı izliyorum" sanmak en pahalı arıza.
mode: simulation          # simulation | live

# Canlı mod (mode: live) — gerçek trafiği yakalar.
#
# Kimlik ile hacim Windows'ta aynı kaynaktan gelmiyor: paket yakalama baytı
# verir ama süreci bilmez, bağlantı tablosu süreci verir ama baytı bilmez.
# Sistem ikisini 5'li üzerinden birleştiriyor (ntc/traffic/live.py).
#
# ⚠️ Yakalama Npcap sürücüsü istiyor; kurulum "non-admin" seçilmediyse
# süreci yönetici olarak çalıştırmak gerekir.
live:
  # Boş bırakılırsa arayüz TAHMİN EDİLİYOR: kurulu dış bağlantıların yerel
  # adreslerine bakılıp o adresi taşıyan arayüz seçiliyor. Tahmin gerekliydi —
  # scapy'nin varsayılanı bu makinede bir TAP adaptörüydü ve yakalama
  # "çalışıyor" görünüp 0 paket üretiyordu. Yine de birden çok aktif arayüz
  # varsa doğrusunu buraya yazmak en güvenlisi.
  interface: ""
  bpf_filter: "ip or ip6"
  # Yalnız yansıtma (SPAN) portunda anlamlı.
  promiscuous: false
  # Bağlantı tablosu yoklaması. Kısa ömürlü bağlantılar (tek HTTP isteği,
  # DNS) iki yoklama arasında kapanıyor; ttl onları bir süre hatırlatıyor.
  # Ölçüldü: bu yoklamayla süreç çözülme oranı %70; kalan kayıp ağırlıklı
  # olarak yoklama arasında doğup ölen bağlantılar. Sysmon Event 3 olay
  # tabanlı olduğu için o boşluğu kapatır.
  owner_poll_seconds: 1.0
  owner_ttl_seconds: 120.0

# Hat kapasitesi. ⚠️ Bir `topology:` bloğu varsa bu değerler **oradan
# türetiliyor** ve buradakiler yok sayılıyor — panel doluluğu ile çözücünün
# darboğazı ayrışmasın diye (bir kez ayrıştılar). Elle tutmak istiyorsan
# `topology:` bloğunu tamamen sil.
link:
  downlink_mbps: 300
  uplink_mbps: 40
  congestion_threshold: 0.80   # bu oranın üstü "tıkanma" sayılır
  critical_threshold: 0.94     # bu oranın üstü "kritik"

collector:
  tick_seconds: 1.0       # simülatörün kaç saniyede bir akış üreteceği
  window_seconds: 60      # metrik penceresi

# Akış optimize edici (ntc/traffic/flowopt.py)
flow:
  enabled: true
  interval_seconds: 15      # LP çözümü; eşik döngüsünden seyrek koşuyor
  min_pullback_mbps: 0.5    # bunun altındaki eksik "geri çek" sayılmıyor

# Topoloji — ağın gerçek şekli; çözücünün üzerinde çalıştığı grafik.
#
# **Optimizasyonun değeri buradan geliyor.** Tek çıkışlı bir ağda çözücünün
# yapabileceği tek şey paylaştırmak: birinden alıp ötekine vermek, toplam
# sabit kalır. Birden çok çıkış olunca boşta duran bacak kullanılıyor ve
# kazanç gerçek oluyor. Ölçüldü (220 Mbps talep, 100 Mbps'lik bacaklar):
#
#     tek hat  -> 100 Mbps geçiyor  (%45)
#     iki hat  -> 200 Mbps geçiyor  (%91)   = x2.00
#
# İki kullanım biçimi var:
#
# 1) `generate:` — tohumlu rastgele ama gerçekçi bir ağ üretir. Elle yazılmış
#    tek bir topolojide çalışmak hiçbir şey kanıtlamıyor; sistemin işi *ne
#    bulursa onda* çalışmak. Tohumu değiştir, ağ değişir, sistem çalışmaya
#    devam eder.
# 2) `edges:` — gerçek ağını birebir yaz (aşağıdaki örneğe bak).
topology:
  generate:
    seed: 7            # aynı tohum = aynı ağ (tekrarlanabilirlik)
    sites: 3           # uçtaki LAN sayısı (her biri access + dist router)
    egresses: 2        # WAN çıkışı sayısı — 1 yaparsan kazanç sıfırlanır
    downlink_mbps: 300 # tüm çıkışların toplamı
    uplink_mbps: 40

# Gerçek ağını elle yazmak istersen `generate:` yerine:
#
# topology:
#   default_access: sw-access
#   access_nodes: [access-1, access-2]   # cihazlar bunlara hash ile dağılır
#   edges:
#     - {src: access-1, dst: core,     capacity_mbps: 1000, kind: access}
#     - {src: core,     dst: access-1, capacity_mbps: 1000, kind: access}
#     - {src: core,     dst: nvr,      capacity_mbps: 1000, kind: lan}
#     - {src: nvr,      dst: core,     capacity_mbps: 1000, kind: lan}
#     # YÜKLEME: cihazdan internete
#     - {src: core,     dst: fiber,    capacity_mbps: 20,  latency_ms: 8,  kind: wan}
#     - {src: fiber,    dst: internet, capacity_mbps: 20,  latency_ms: 8,  kind: wan}
#     # İNDİRME: internetten cihaza — yön fiziksel olarak doğru olmak zorunda
#     - {src: internet, dst: fiber,    capacity_mbps: 200, latency_ms: 8,  kind: wan}
#     - {src: fiber,    dst: core,     capacity_mbps: 200, latency_ms: 8,  kind: wan}
#     # cost_per_gb: sayaçlı hatlar (LTE) — çözücü eşit koşulda ucuzu seçer
#     # health: 0.0-1.0 — bozulan hattı silmek yerine daraltmak için

optimizer:
  enabled: true
  interval_seconds: 5
  auto_apply: false       # true ise öneriler otomatik "uygulandı" işaretlenir
  hog_share_threshold: 0.35    # tek cihaz toplam bandın %35'ini aşarsa hog
  min_confidence_to_apply: 0.7

ai:
  provider: auto          # auto | foundry | ollama | mock
  # Takma ad `phi-4-mini` varsayilan olarak OpenVINO varyantina cozuluyor;
  # o Intel iGPU'da kosuyor ve olculen hiz 9.5 tok/sn. Bu makinede RTX 4060
  # var, CUDA varyanti 60 tok/sn veriyor -> varyanti acikca sabitliyoruz.
  # Baska bir makinede: takma ada geri don (phi-4-mini) ya da o makinenin
  # varyantini yaz. `foundry model info phi-4-mini` secenekleri listeler.
  model: Phi-4-mini-instruct-cuda-gpu
  base_url: ""            # boş = Foundry Local ucu otomatik keşfedilir
  temperature: 0.2
  timeout_seconds: 120
  # Ollama geliştirme yedeği (model adlandırması Foundry'den farklı)
  ollama_base_url: http://127.0.0.1:11434
  ollama_model: phi4-mini
  analysis_interval_seconds: 30   # AI analistin çalışma sıklığı
  max_snapshot_flows: 25

# İnfaz katmanı — hesaplanan planı ağa taşıyan kısım.
enforce:
  enabled: true
  # ⚠️ `golge` = komut üretilir, ÇALIŞTIRILMAZ. Canlı mod bilerek
  # bağlanmadı: üzerinde doğrulama yapılabilecek gerçek bir cihaz yokken
  # yazılan çalıştırma kodu "hazır" görünür ama sınanmamış olur.
  mode: golge             # golge | canli (canli henüz bağlı değil)
  # anlat  = Türkçe anlatır, cihaz gerektirmez (varsayılan, demo için)
  # linux  = tc + ip rule + iptables komutları üretir
  # windows= New-NetQosPolicy üretir (yalnız yükleme + damga yapabilir)
  #
  # Gerçek kurulumda ikisi birden: çekirdekte router, uçta Windows domain.
  # core_driver: linux
  # edge_driver: windows
  #
  # İkisi de boşsa aşağıdaki tek sürücü tüm kapsamlara bakar:
  driver: anlat
  # Kısan her kural (hız tavanı, yol ataması) operatör onayı bekler.
  # Damgalar onay istemez: kimseyi kısmazlar, yalnız trafiği tanıtırlar.
  require_approval: true
  # linux sürücüsü için:
  wan_if: eth1
  lan_if: eth0
  # tables:               # çıkış düğümü -> `ip route` tablo adı
  #   wan-a: netpilot1    # tanımsız çıkış için yol kuralı üretilmez,
  #   wan-b: netpilot2    # sessizce yanlış yapmaktansa "atlandı" der

api:
  host: 127.0.0.1
  port: 8080

storage:
  path: data/ntc.db
  retain_hours: 24

logging:
  level: INFO
